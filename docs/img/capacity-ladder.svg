<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 338" width="880" height="338" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="t">The capacity definition ladder</title><desc id="d">Built 188.04 MW, installed 131.88 MW, operational 113.67 MW. A drop of 40 per cent from the headline to the capacity earning revenue.</desc>
<rect width="880" height="338" fill="#f7f6f3"/>
<text x="28" y="40" fill="#16181d" font-size="19" font-weight="600" text-anchor="start">One estate, one date, three capacity figures</text><text x="28" y="64" fill="#6b7280" font-size="12.5" font-weight="400" text-anchor="start">Sify Infinit Spaces, draft red herring prospectus, printed page 49</text><text x="28" y="113" fill="#16181d" font-size="13.5" font-weight="600" text-anchor="start">Built</text><rect x="160" y="96" width="596" height="26" rx="2" fill="#2f5fd0"/><text x="766" y="114" fill="#16181d" font-size="13.5" font-weight="600" text-anchor="start" font-variant-numeric="tabular-nums">188.04 MW</text><text x="28" y="132" fill="#6b7280" font-size="11.5" font-weight="400" text-anchor="start">Engineered to support. Not constructed.</text><text x="28" y="175" fill="#16181d" font-size="13.5" font-weight="600" text-anchor="start">Installed</text><rect x="160" y="158" width="418" height="26" rx="2" fill="#2f5fd0"/><text x="588" y="176" fill="#16181d" font-size="13.5" font-weight="600" text-anchor="start" font-variant-numeric="tabular-nums">131.88 MW</text><text x="28" y="194" fill="#6b7280" font-size="11.5" font-weight="400" text-anchor="start">Equipped and commissioned.</text><text x="28" y="237" fill="#16181d" font-size="13.5" font-weight="600" text-anchor="start">Operational</text><rect x="160" y="220" width="360.28" height="26" rx="2" fill="#c8443c"/><text x="530.28" y="238" fill="#16181d" font-size="13.5" font-weight="600" text-anchor="start" font-variant-numeric="tabular-nums">113.67 MW</text><text x="28" y="256" fill="#6b7280" font-size="11.5" font-weight="400" text-anchor="start">Sold to a paying customer.</text><line x1="28" y1="276" x2="852" y2="276" stroke="#dcd9d4"/><text x="28" y="300" fill="#16181d" font-size="13" font-weight="600" text-anchor="start">The headline is 65 per cent larger than the estate earning revenue.</text><text x="28" y="320" fill="#6b7280" font-size="11.5" font-weight="400" text-anchor="start">Eleven days later the same estate was described on a call as "188 megawatts of design capacity, of which about 130-megawatt is built".</text>
</svg>