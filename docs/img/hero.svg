<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 216" width="880" height="216" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="t">Announced against live capacity across eight Indian operators</title><desc id="d">10638.04 MW announced against 618.67 MW live, which is 5.8 per cent.</desc>
<rect width="880" height="216" fill="#f7f6f3"/>
<text x="30" y="44" fill="#6b7280" font-size="13" font-weight="600" text-anchor="start">India's listed data centre buildout</text><text x="30" y="84" fill="#16181d" font-size="30" font-weight="700" text-anchor="start">10,638.04 MW announced.</text><text x="330" y="84" fill="#c8443c" font-size="30" font-weight="700" text-anchor="start">618.67 MW live.</text><rect x="30" y="106" width="820" height="30" rx="2" fill="#c9d6f0"/><rect x="30" y="106" width="47.69" height="30" rx="2" fill="#c8443c"/><text x="30" y="160" fill="#16181d" font-size="15" font-weight="600" text-anchor="start">5.8 per cent of what has been announced is carrying load today.</text><text x="30" y="184" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start">Eight operators, every figure the operator's own. The red sliver is the whole of the delivered estate.</text>
</svg>