<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="t">Announced against live capacity across India's listed data centre operators</title><desc id="d">10,638 MW announced against 618.67 MW live, which is 5.8 per cent.</desc>
<rect width="880" height="250" fill="#f7f6f3"/>
<text x="32" y="46" fill="#6b7280" font-size="12" font-weight="700" text-anchor="start">INDIA'S LISTED DATA CENTRE BUILDOUT</text><text x="32" y="112" fill="#c8443c" font-size="58" font-weight="700" text-anchor="start">5.8%</text><text x="184" y="92" fill="#16181d" font-size="20" font-weight="600" text-anchor="start">of everything announced</text><text x="184" y="116" fill="#16181d" font-size="20" font-weight="600" text-anchor="start">is carrying load today</text><rect x="32" y="146" width="816" height="26" rx="2" fill="#c9d6f0"/><rect x="32" y="146" width="47.46" height="26" rx="2" fill="#c8443c"/><text x="32" y="196" fill="#16181d" font-size="15" font-weight="600" text-anchor="start" font-variant-numeric="tabular-nums">10,638 MW announced</text><text x="848" y="196" fill="#c8443c" font-size="15" font-weight="600" text-anchor="end" font-variant-numeric="tabular-nums">618.67 MW live</text><line x1="32" y1="212" x2="848" y2="212" stroke="#dcd9d4"/><text x="32" y="232" fill="#6b7280" font-size="12" font-weight="400" text-anchor="start">8 operators. Every figure is the operator's own. The red sliver is the whole of the delivered estate.</text>
</svg>