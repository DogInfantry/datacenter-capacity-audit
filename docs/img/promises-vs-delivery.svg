<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="t">Dated capacity promises against commissioned capacity</title><desc id="d">100 MW of the announced 200 MW expansion goes live within 18 months, status MISSED; More than 124 MW of campuses available within 12 months, status MISSED</desc>
<rect width="880" height="380" fill="#f7f6f3"/>
<text x="34" y="40" fill="#16181d" font-size="19" font-weight="600" text-anchor="start">What was promised on a call, against what was then commissioned</text><text x="34" y="64" fill="#6b7280" font-size="12.5" font-weight="400" text-anchor="start">Sify Technologies. Blue line is capacity management said was commissioned. Red marks are dated promises.</text><line x1="58" y1="306" x2="846" y2="306" stroke="#dcd9d4"/><text x="50" y="310" fill="#6b7280" font-size="11" font-weight="400" text-anchor="end" font-variant-numeric="tabular-nums">0</text><line x1="58" y1="235.77" x2="846" y2="235.77" stroke="#dcd9d4"/><text x="50" y="239.77" fill="#6b7280" font-size="11" font-weight="400" text-anchor="end" font-variant-numeric="tabular-nums">50</text><line x1="58" y1="165.53" x2="846" y2="165.53" stroke="#dcd9d4"/><text x="50" y="169.53" fill="#6b7280" font-size="11" font-weight="400" text-anchor="end" font-variant-numeric="tabular-nums">100</text><polyline fill="none" stroke="#2f5fd0" stroke-width="2.5" points="58,204.86 104.26,202.05 285.76,165.53 379.81,165.53 516.57,165.53 657.9,137.44 702.13,137.44 846,123.39"/><circle cx="58" cy="204.86" r="3.5" fill="#2f5fd0"/><circle cx="104.26" cy="202.05" r="3.5" fill="#2f5fd0"/><circle cx="285.76" cy="165.53" r="3.5" fill="#2f5fd0"/><circle cx="379.81" cy="165.53" r="3.5" fill="#2f5fd0"/><circle cx="516.57" cy="165.53" r="3.5" fill="#2f5fd0"/><circle cx="657.9" cy="137.44" r="3.5" fill="#2f5fd0"/><circle cx="702.13" cy="137.44" r="3.5" fill="#2f5fd0"/><circle cx="846" cy="123.39" r="3.5" fill="#2f5fd0"/><line x1="564.35" y1="88" x2="564.35" y2="306" stroke="#c8443c" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M 559.35 94 L 569.35 104 M 569.35 94 L 559.35 104" stroke="#c8443c" stroke-width="2"/><text x="553.35" y="103" fill="#c8443c" font-size="11" font-weight="600" text-anchor="end">100 MW of the announced 200 MW expansion goes live within 18 months · missed</text><line x1="565.88" y1="88" x2="565.88" y2="306" stroke="#c8443c" stroke-width="1.4" stroke-dasharray="4 3"/><path d="M 560.88 114 L 570.88 124 M 570.88 114 L 560.88 124" stroke="#c8443c" stroke-width="2"/><text x="554.88" y="123" fill="#c8443c" font-size="11" font-weight="600" text-anchor="end">More than 124 MW of campuses available within 12 months · missed</text><text x="58" y="326" fill="#6b7280" font-size="11" font-weight="400" text-anchor="start" font-variant-numeric="tabular-nums">2021-07-30</text><text x="846" y="326" fill="#6b7280" font-size="11" font-weight="400" text-anchor="end" font-variant-numeric="tabular-nums">2025-10-27</text><line x1="34" y1="340" x2="846" y2="340" stroke="#dcd9d4"/><text x="34" y="362" fill="#16181d" font-size="12.5" font-weight="600" text-anchor="start">Both dated promises were missed. Commissioned capacity went from 72 MW to 130 MW over the window.</text>
</svg>