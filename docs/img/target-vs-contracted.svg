<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 276" width="880" height="276" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="t">A 250 MW target against the capital contracted for</title><desc id="d">Target 250 MW, live 24 MW, and contracted capital of 118.05 million rupees buying about 0.20 MW.</desc>
<rect width="880" height="276" fill="#f7f6f3"/>
<text x="28" y="40" fill="#16181d" font-size="19" font-weight="600" text-anchor="start">A 250 megawatt target, and the capital actually contracted for</text><text x="28" y="64" fill="#6b7280" font-size="12.5" font-weight="400" text-anchor="start">Techno Electric annual report FY2025-26. Target from management discussion, the rest audited.</text><text x="28" y="110" fill="#16181d" font-size="12.5" font-weight="400" text-anchor="start">Targeted by FY 2029-30</text><rect x="178" y="96" width="674" height="20" rx="2" fill="#c9d6f0"/><text x="861" y="111" fill="#16181d" font-size="12.5" font-weight="600" text-anchor="start" font-variant-numeric="tabular-nums">250 MW</text><text x="28" y="142" fill="#16181d" font-size="12.5" font-weight="400" text-anchor="start">Commissioned and live</text><rect x="178" y="128" width="64.7" height="20" rx="2" fill="#2f5fd0"/><text x="251.7" y="143" fill="#16181d" font-size="12.5" font-weight="600" text-anchor="start" font-variant-numeric="tabular-nums">24 MW</text><text x="28" y="174" fill="#16181d" font-size="12.5" font-weight="400" text-anchor="start">Bought by contracted capital</text><rect x="178" y="160" width="1.5" height="20" rx="2" fill="#c8443c"/><text x="188.5" y="175" fill="#16181d" font-size="12.5" font-weight="600" text-anchor="start" font-variant-numeric="tabular-nums">0.20 MW</text><line x1="28" y1="196" x2="852" y2="196" stroke="#dcd9d4"/><text x="28" y="220" fill="#16181d" font-size="13" font-weight="600" text-anchor="start">The only audited line recording contracts for future capital spending is 118.05 million rupees.</text><text x="28" y="240" fill="#6b7280" font-size="11.5" font-weight="400" text-anchor="start">At the sector build cost of 60 to 70 crore per megawatt that buys about a fifth of one megawatt. It is 7.59 times smaller</text><text x="28" y="256" fill="#6b7280" font-size="11.5" font-weight="400" text-anchor="start">than the overdue receivables the company's own auditor drew attention to.</text>
</svg>