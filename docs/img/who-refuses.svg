<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 252" width="880" height="252" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="t">Refusal rates over the number of questions actually pressed</title><desc id="d">Digital Realty Trust, Inc.: 9 refused of 34 pressed, 0.81 per call; Equinix, Inc.: 9 refused of 20 pressed, 0.48 per call; Sify Technologies Limited: 2 refused of 15 pressed, 0.43 per call</desc>
<rect width="880" height="252" fill="#f7f6f3"/>
<text x="30" y="40" fill="#16181d" font-size="19" font-weight="600" text-anchor="start">Who refuses, and who was actually asked</text><text x="30" y="64" fill="#6b7280" font-size="12.5" font-weight="400" text-anchor="start">Bar length is how often the question was pressed. The filled part is how often it was refused.</text><text x="30" y="82" fill="#6b7280" font-size="12.5" font-weight="400" text-anchor="start">A company nobody presses has little to refuse, so the denominator is drawn rather than footnoted.</text><text x="30" y="119" fill="#16181d" font-size="12.5" font-weight="400" text-anchor="start">Digital Realty Trust, Inc.</text><rect x="220" y="104" width="462" height="22" rx="2" fill="#c9d6f0"/><rect x="220" y="104" width="122.29" height="22" rx="2" fill="#c8443c"/><text x="692" y="120" fill="#16181d" font-size="12" font-weight="400" text-anchor="start" font-variant-numeric="tabular-nums">9 refused of 34 pressed   0.81 a call</text><text x="30" y="153" fill="#16181d" font-size="12.5" font-weight="400" text-anchor="start">Equinix, Inc.</text><rect x="220" y="138" width="271.76" height="22" rx="2" fill="#c9d6f0"/><rect x="220" y="138" width="122.29" height="22" rx="2" fill="#c8443c"/><text x="501.76" y="154" fill="#16181d" font-size="12" font-weight="400" text-anchor="start" font-variant-numeric="tabular-nums">9 refused of 20 pressed   0.48 a call</text><text x="30" y="187" fill="#16181d" font-size="12.5" font-weight="400" text-anchor="start">Sify Technologies Limited</text><rect x="220" y="172" width="203.82" height="22" rx="2" fill="#c9d6f0"/><rect x="220" y="172" width="27.18" height="22" rx="2" fill="#c8443c"/><text x="433.82" y="188" fill="#16181d" font-size="12" font-weight="400" text-anchor="start" font-variant-numeric="tabular-nums">2 refused of 15 pressed   0.43 a call</text><line x1="30" y1="210" x2="850" y2="210" stroke="#dcd9d4"/><text x="30" y="234" fill="#16181d" font-size="13" font-weight="600" text-anchor="start">The Indian operator refuses least by rate. It is also the one asked least.</text>
</svg>